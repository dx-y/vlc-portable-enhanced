name: Build VLC Enhanced

# 交付路线（注入式）：
#   1. 官方 vlc-debian-win64 容器 + 官方预编译 contrib，只编译被补丁影响的 GUI 模块
#   2. 下载 VLC 官方 win64 原包，把编译出的 libqt_plugin.dll 换进去
#   3. 重新封装为 7z / zip / exe(NSIS) / msi(MSI)，并发布 Release
# 触发：每日检查上游 3.0.x 新正式版；也可手动指定版本强制重建。

on:
  workflow_dispatch:
    inputs:
      vlc_version:
        description: 'VLC 版本（留空则取 3.0 分支最新正式版）'
        required: false
        default: ''
      contrib_url:
        description: '预编译 contrib 地址（留空用默认）'
        required: false
        default: ''
      force:
        description: '该版本已发布过也强制重建（填 1）'
        required: false
        default: ''
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: videolan/vlc
  DEFAULT_CONTRIB_URL: https://artifacts.videolan.org/vlc-3.0/win64/vlc-contrib-x86_64-w64-mingw32-910cc9cada6080dd777fbafb2ebdd0c24f702c30.tar.zst
  CONTAINER: registry.videolan.org/vlc-debian-win64:20240122094311

jobs:
  # ---------------------------------------------------------------- 版本解析
  resolve:
    name: Resolve upstream version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      need_build: ${{ steps.ver.outputs.need_build }}
    steps:
      - name: Resolve version (git ls-remote, no API quota)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VERSION: ${{ github.event.inputs.vlc_version }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${IN_VERSION}" ]; then
            VER="${IN_VERSION}"
            echo "版本由手动输入指定: $VER"
          else
            VER=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" \
                  | awk '{print $2}' | sed 's|refs/tags/||' \
                  | grep -E '^3\.0\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "${VER}" ]; then
              echo "::error::未能从上游解析出 3.0.x 版本号"
              exit 1
            fi
            echo "上游最新 3.0.x: $VER"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

          if [ "${IN_FORCE}" = "1" ]; then
            echo "force=1，强制重建"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "v${VER}-enhanced" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "v${VER}-enhanced 已存在，本次跳过构建"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${VER}-enhanced 不存在，开始构建"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- 构建打包
  build:
    name: Build + package
    needs: resolve
    if: needs.resolve.outputs.need_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VLC_VER: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
                      /opt/az /usr/share/swift /usr/local/graalvm /usr/local/.ghcup || true
          df -h /

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full zip unzip zstd nsis msitools \
                                        binutils-mingw-w64-x86-64 uuid-runtime

      # Ubuntu 的 msitools 包只带 msibuild/msidump 等 C 工具，wixl（Vala 实现）未随包分发。
      # 因此在 runner 上从源码编一个 wixl 到 $HOME/wixl，并把 bin 目录注册进 PATH。
      - name: Build wixl from source (msitools)
        run: |
          set -euo pipefail
          PREFIX="$HOME/wixl"
          if command -v wixl >/dev/null 2>&1; then
            echo "wixl 已存在: $(command -v wixl)"; exit 0
          fi
          if [ -x "$PREFIX/bin/wixl" ]; then
            echo "复用已编译的 wixl: $PREFIX/bin/wixl"
            echo "$PREFIX/bin" >> "$GITHUB_PATH"; exit 0
          fi
          sudo apt-get install -y -qq valac meson ninja-build bison perl pkg-config \
                                    libglib2.0-dev libgsf-1-dev libgcab-dev libxml2-dev gettext \
                                    libgirepository1.0-dev
          curl -fsSL -o /tmp/msitools.tar.xz \
            https://download.gnome.org/sources/msitools/0.103/msitools-0.103.tar.xz
          tar -xf /tmp/msitools.tar.xz -C /tmp
          cd /tmp/msitools-0.103
          # 使用系统 libgcab-dev：上游源码在 runner 上已无法获取（gnome tarball 404、gitlab 需登录、
          # apt 无 deb-src 索引），msi 的 cab 压缩级别维持 wixl 默认
          pkg-config --modversion libgcab-1.0 || true
          # 必须保留 introspection：wixl 依赖 libmsi_vapi，关掉 introspection 会让 wixl 目标被静默跳过
          meson setup _build -Dintrospection=true --prefix="$PREFIX" -Dbuildtype=release
          meson compile -C _build
          meson install -C _build
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          # wixl 运行时需要同前缀下的 libmsi-1.0.so，注册到动态链接器搜索路径
          echo "$PREFIX/lib/x86_64-linux-gnu" | sudo tee /etc/ld.so.conf.d/wixl.conf >/dev/null
          sudo ldconfig
          ls -l "$PREFIX/bin" || true
          "$PREFIX/bin/wixl" --version || true
          test -x "$PREFIX/bin/wixl"

      - name: Prepare inputs
        run: |
          set -euo pipefail
          mkdir -p out work pkg official
          cat patches/*.patch > patch.diff
          wc -l patch.diff
          sed -i 's/\r$//' ci/build-gui-module.sh
          chmod +x ci/build-gui-module.sh

      - name: Pull official container image
        run: docker pull "$CONTAINER"

      - name: Cache build tree (source + contrib + objects)
        id: cache-src
        uses: actions/cache@v4
        with:
          path: |
            work/vlc-${{ env.VLC_VER }}
            work/contrib-extract
          key: vlc-build-${{ env.VLC_VER }}-${{ hashFiles('patches/*.patch') }}-v3

      - name: Fetch prebuilt contrib (on runner)
        env:
          IN_URL: ${{ github.event.inputs.contrib_url }}
        run: |
          set -euo pipefail
          if [ -d work/contrib-extract/x86_64-w64-mingw32/lib ]; then
            echo "contrib 已从缓存恢复，跳过下载"
            exit 0
          fi
          URL="${IN_URL:-$DEFAULT_CONTRIB_URL}"
          echo "下载: $URL"
          curl -fL --retry 3 --retry-delay 5 "$URL" -o work/contrib.tar.zst
          ls -lh work/contrib.tar.zst
          mkdir -p work/contrib-extract
          time tar -I zstd -xf work/contrib.tar.zst -C work/contrib-extract
          INNER=$(find work/contrib-extract -maxdepth 2 -type f \( -name '*.tar.zst' -o -name '*.tar.bz2' -o -name '*.tar.gz' -o -name '*.tar.xz' \) | head -1 || true)
          if [ -n "$INNER" ]; then
            echo "内层压缩包: $INNER"
            tar -I zstd -xf "$INNER" -C work/contrib-extract 2>/dev/null || true
          fi
          echo "contrib 解包体积: $(du -sh work/contrib-extract | cut -f1)"
          test -d work/contrib-extract/x86_64-w64-mingw32/include || { echo "::error::contrib 缺少 include"; exit 3; }

      - name: Prepare newer glibc for Qt host tools
        run: |
          set -euo pipefail
          mkdir -p debs glibc-root
          cd debs
          sudo apt-get update -qq
          apt-get download libc6 libstdc++6 libgcc-s1 || {
            echo "::warning::直接下载失败，按刷新后的索引解析可用版本重试"
            for p in libc6 libstdc++6 libgcc-s1; do
              V=$(apt-cache madison "$p" | awk -F'|' 'NR==1{gsub(/ /,"",$2); print $2}')
              if [ -n "${V:-}" ]; then apt-get download "${p}=${V}" || true; fi
            done
          }
          ls -1 *.deb || { echo "::error::未获取到任何 glibc deb"; exit 1; }
          for f in *.deb; do dpkg-deb -x "$f" ../glibc-root; done

      - name: Build GUI module (container)
        env:
          IN_URL: ${{ github.event.inputs.contrib_url }}
        run: |
          set -euo pipefail
          URL="${IN_URL:-$DEFAULT_CONTRIB_URL}"
          echo "VLC=${VLC_VER}  CONTRIB=$URL  cache_hit=${{ steps.cache-src.outputs.cache-hit }}"
          docker run --rm --user root \
            -v "$PWD":/build \
            -w /build \
            -e VLC_VER="${VLC_VER}" \
            -e CONTRIB_URL="$URL" \
            -e WORK=/build/work \
            -v "$PWD/glibc-root":/opt/glibc:ro \
            "$CONTAINER" \
            bash /build/ci/build-gui-module.sh 2>&1 | tee build.log

      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" . || true

      - name: Verify built dll
        run: |
          set -euo pipefail
          ls -l out/
          test -f out/libqt_plugin.dll || { echo "::error::out/libqt_plugin.dll 未生成"; exit 1; }
          BEFORE=$(stat -c %s out/libqt_plugin.dll)
          echo "strip 前: $BEFORE 字节"
          x86_64-w64-mingw32-strip --strip-unneeded out/libqt_plugin.dll || \
            echo "::warning::strip 失败，保持原样"
          AFTER=$(stat -c %s out/libqt_plugin.dll)
          echo "strip 后: $AFTER 字节"
          echo "BUILT_DLL_SIZE=$AFTER" >> "$GITHUB_ENV"

      - name: Download official win64 packages
        run: |
          set -euo pipefail
          BASE="https://download.videolan.org/pub/videolan/vlc/${VLC_VER}/win64"
          curl -fL --retry 3 --retry-delay 5 -o "official/vlc-${VLC_VER}-win64.7z"  "${BASE}/vlc-${VLC_VER}-win64.7z"
          curl -fL --retry 3 --retry-delay 5 -o "official/vlc-${VLC_VER}-win64.exe" "${BASE}/vlc-${VLC_VER}-win64.exe"
          ls -lh official/

      - name: Assemble portable tree (swap dll)
        run: |
          set -euo pipefail
          cd pkg
          7z x -y "../official/vlc-${VLC_VER}-win64.7z" >/dev/null
          TREE=$(find . -maxdepth 1 -mindepth 1 -type d | head -1 || true)
          echo "官方解包目录: $TREE"
          test -n "$TREE" || { echo "::error::官方包解包后无顶层目录"; exit 1; }
          test -f "$TREE/vlc.exe" || { echo "::error::官方包内未找到 vlc.exe"; exit 1; }
          test -d "$TREE/plugins/gui" || { echo "::error::官方包内未找到 plugins/gui"; exit 1; }
          cp "$TREE/plugins/gui/libqt_plugin.dll" "../out/libqt_plugin.official.dll"
          echo "官方原版 dll: $(stat -c %s "$TREE/plugins/gui/libqt_plugin.dll") 字节"
          cp "../out/libqt_plugin.dll" "$TREE/plugins/gui/libqt_plugin.dll"
          echo "替换后 dll: $(stat -c %s "$TREE/plugins/gui/libqt_plugin.dll") 字节"
          NEW="vlc-${VLC_VER}-enhanced-win64"
          mv "$TREE" "$NEW"
          echo "TREE_NAME=$NEW" >> "$GITHUB_ENV"

      - name: Package 7z and zip
        run: |
          set -euo pipefail
          cd pkg
          NEW="${TREE_NAME}"
          7z a -t7z  -mx=9 "../out/${NEW}.7z"  "$NEW" >/dev/null
          7z a -tzip -mx=9 "../out/${NEW}.zip" "$NEW" >/dev/null
          ls -lh ../out/

      - name: Package NSIS installer (exe)
        continue-on-error: true
        run: |
          set -euo pipefail
          cat > installer.nsi <<'NSI'
          Unicode true
          !include "MUI2.nsh"
          !ifndef VERSION
            !define VERSION "0.0.0"
          !endif
          !ifndef SRCDIR
            !define SRCDIR "pkg"
          !endif
          !ifndef OUTFILE
            !define OUTFILE "out/setup.exe"
          !endif
          Name "VLC media player ${VERSION} Enhanced"
          OutFile "${OUTFILE}"
          InstallDir "$PROGRAMFILES64\VideoLAN\VLC"
          InstallDirRegKey HKLM "Software\VideoLAN\VLC" ""
          RequestExecutionLevel admin
          SetCompressor /SOLID lzma
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "SimpChinese"
          !insertmacro MUI_LANGUAGE "English"

          Section "VLC Enhanced" SecMain
            SetOutPath "$INSTDIR"
            File /r "${SRCDIR}/*"
            WriteUninstaller "$INSTDIR\uninstall-enhanced.exe"
            CreateDirectory "$SMPROGRAMS\VLC Enhanced"
            CreateShortCut "$SMPROGRAMS\VLC Enhanced\VLC media player.lnk" "$INSTDIR\vlc.exe"
            CreateShortCut "$DESKTOP\VLC media player.lnk" "$INSTDIR\vlc.exe"
            WriteRegStr HKLM "Software\VideoLAN\VLC" "" "$INSTDIR"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\VLCEnhanced" "DisplayName" "VLC ${VERSION} Enhanced"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\VLCEnhanced" "DisplayVersion" "${VERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\VLCEnhanced" "Publisher" "dx-y"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\VLCEnhanced" "UninstallString" "$INSTDIR\uninstall-enhanced.exe"
          SectionEnd

          Section "Uninstall"
            RMDir /r "$INSTDIR"
            Delete "$DESKTOP\VLC media player.lnk"
            RMDir /r "$SMPROGRAMS\VLC Enhanced"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\VLCEnhanced"
            DeleteRegKey HKLM "Software\VideoLAN\VLC"
          SectionEnd
          NSI
          makensis -V2 \
            -DVERSION="${VLC_VER}" \
            -DSRCDIR="$PWD/pkg/${TREE_NAME}" \
            -DOUTFILE="$PWD/out/${TREE_NAME}-setup.exe" \
            installer.nsi
          ls -lh out/*.exe

      - name: Package MSI
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - "$PWD/pkg/${TREE_NAME}" "$PWD/out/${TREE_NAME}.msi" "$VLC_VER" <<'PY'
          import os, sys, uuid
          root, out, ver = sys.argv[1], sys.argv[2], sys.argv[3]
          NS = "http://schemas.microsoft.com/wix/2006/wi"
          def gid(s):
              return "{" + str(uuid.uuid5(uuid.NAMESPACE_URL, s)).upper() + "}"
          v4 = ver if ver.count(".") == 2 else ver + ".0"
          dirs, files = {}, []
          for dp, dns, fns in os.walk(root):
              rel = os.path.relpath(dp, root)
              did = "INSTALLDIR" if rel == "." else "D_" + gid(rel)[1:9]
              dirs[did] = (rel, did)
              for fn in fns:
                  files.append((did, fn, os.path.join(dp, fn), rel))
          lines = ['<?xml version="1.0" encoding="utf-8"?>',
                   '<Wix xmlns="%s">' % NS,
                   '  <Product Id="%s" Name="VLC %s Enhanced" Language="2052" Version="%s" Manufacturer="dx-y" UpgradeCode="%s">' % (gid("vlc-enhanced-product"), ver, v4, gid("vlc-enhanced-upgrade")),
                   '    <Package InstallerVersion="300" Compressed="yes" InstallScope="perMachine" Platform="x64"/>',
                   '    <Media Id="1" Cabinet="product.cab" EmbedCab="yes"/>',
                   '    <Directory Id="TARGETDIR" Name="SourceDir">',
                   '      <Directory Id="ProgramFiles64Folder">',
                   '        <Directory Id="INSTALLDIR" Name="VLC">']
          # 目录树按层级输出
          children = {}
          for did, (rel, _) in dirs.items():
              if did == "INSTALLDIR":
                  continue
              parent = os.path.dirname(rel)
              pid = "INSTALLDIR" if parent in ("", ".") else "D_" + gid(parent)[1:9]
              children.setdefault(pid, []).append((did, os.path.basename(rel)))
          def emit(did, ind):
              for cid, name in sorted(children.get(did, [])):
                  lines.append(" " * ind + '<Directory Id="%s" Name="%s">' % (cid, name))
                  emit(cid, ind + 2)
                  lines.append(" " * ind + '</Directory>')
          emit("INSTALLDIR", 10)
          lines += ['        </Directory>', '      </Directory>', '    </Directory>',
                    '    <Feature Id="DefaultFeature" Title="VLC Enhanced" Level="1">',
                    '      <ComponentGroupRef Id="Files"/>', '    </Feature>', '  </Product>',
                    '  <Fragment>', '    <ComponentGroup Id="Files">']
          n = 0
          for did, fn, src, rel in files:
              n += 1
              lines += ['      <Component Id="C_%d" Directory="%s" Guid="%s">' % (n, did, gid(rel + "/" + fn)),
                        '        <File Id="F_%d" Name="%s" Source="%s"/>' % (n, fn, src),
                        '      </Component>']
          lines += ['    </ComponentGroup>', '  </Fragment>', '</Wix>']
          open("/tmp/product.wxs", "w", encoding="utf-8").write("\n".join(lines))
          print("wxs 文件数:", n)
          PY
          rc=0
          export LD_LIBRARY_PATH="$HOME/wixl/lib/x86_64-linux-gnu:$HOME/wixl/lib:${LD_LIBRARY_PATH:-}"
          command -v wixl || { echo "::error::wixl 不可用，无法生成 msi"; exit 1; }
          echo "--- wixl 实际加载的 libgcab ---"
          ldd "$(command -v wixl)" | grep -i gcab || true
          wixl -o "out/${TREE_NAME}.msi" /tmp/product.wxs || rc=$?
          if [ "$rc" != "0" ]; then echo "::error::wixl 打包失败"; exit 1; fi
          ls -lh out/*.msi

      - name: Checksums
        run: |
          set -euo pipefail
          cd out
          : > SHA256SUMS.txt
          for f in *.7z *.zip *.exe *.msi; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS.txt
            else
              echo "::warning::缺失产物 $f"
            fi
          done
          cat SHA256SUMS.txt
          ls -lh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vlc-enhanced-${{ env.VLC_VER }}
          path: |
            out/*.7z
            out/*.zip
            out/*.exe
            out/*.msi
            out/SHA256SUMS.txt
            build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VLC_VER}-enhanced"
          FILES=()
          for f in out/*.7z out/*.zip out/*.exe out/*.msi out/SHA256SUMS.txt; do
            if [ -f "$f" ]; then FILES+=("$f"); fi
          done
          echo "待发布文件数: ${#FILES[@]}"
          if [ "${#FILES[@]}" -eq 0 ]; then echo "::error::没有可发布的产物"; exit 1; fi
          printf '%s\n' "${FILES[@]}"
          cat > notes.md <<EOF
          VLC ${VLC_VER} 增强版（注入式构建）

          - 内核与外壳：VLC 官方 ${VLC_VER} win64 原包，未改核心组件
          - 增强模块：按本仓库 patches/ 重新编译的 libqt_plugin.dll（界面增强）
          - 便携形态：7z / zip，解压即用
          - 安装形态：exe / msi

          构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "VLC ${VLC_VER} Enhanced" \
              --notes-file notes.md
          fi

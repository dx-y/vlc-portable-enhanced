name: Build VLC Enhanced Portable

on:
  schedule:
    # 每天 02:30 (UTC+8) 检查上游是否发布新的 3.0.x 正式版
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      vlc_version:
        description: "指定 VLC 版本号（如 3.0.24），留空则自动取 3.0 分支最新正式版"
        required: false
        default: ""
      contrib_url:
        description: "预编译 contrib 包地址，留空则使用默认值"
        required: false
        default: ""
      mode:
        description: "运行模式"
        required: true
        default: full
        type: choice
        options:
          - full
          - probe

permissions:
  contents: write
  issues: write

concurrency:
  group: build-vlc-enhanced
  cancel-in-progress: false

env:
  UPSTREAM_REPO: videolan/vlc
  MINGW_HOST: x86_64-w64-mingw32
  # 与 VLC 3.0.24（tag 时间 2026-09-22）最接近的官方预编译 contrib（3.0 分支 win64）
  DEFAULT_CONTRIB_URL: "https://artifacts.videolan.org/vlc-3.0/win64/vlc-contrib-x86_64-w64-mingw32-910cc9cada6080dd777fbafb2ebdd0c24f702c30.tar.zst"

jobs:
  resolve:
    name: 解析上游版本
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      need_build: ${{ steps.pick.outputs.need_build }}
    steps:
      - name: 选择目标版本
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.vlc_version }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            V="${INPUT_VERSION}"
          else
            V=$(curl -sSf "https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=100" \
                | jq -r '.[].name' | grep -E '^3\.0\.[0-9]+$' | sort -V | tail -n1 || true)
          fi
          if [ -z "${V:-}" ]; then
            echo "无法解析上游 3.0.x 版本号"; exit 1
          fi
          echo "目标版本：${V}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

          TAG="v${V}-enhanced"
          if [ "${MODE}" = "probe" ]; then
            echo "probe 模式，强制执行"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "发布 ${TAG} 已存在，本次跳过构建"
            echo "need_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "发布 ${TAG} 不存在，开始构建"
            echo "need_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 编译与发布
    needs: resolve
    if: needs.resolve.outputs.need_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      VLC_VER: ${{ needs.resolve.outputs.version }}
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "== 清理前 =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /opt/az /usr/share/swift \
            /usr/local/graalvm /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          echo "== 清理后 =="; df -h /

      - name: 安装交叉编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl wget ca-certificates jq unzip zip \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools \
            autoconf automake autopoint libtool libtool-bin pkg-config gettext \
            yasm nasm cmake cvs subversion ragel bison flex \
            p7zip-full bzip2 xz-utils zstd dos2unix \
            protobuf-compiler protobuf-c-compiler \
            libffi-dev libgcrypt20-dev \
            nsis msitools
          # 统一使用 posix 线程模型的 mingw 工具链
          for p in x86_64-w64-mingw32-gcc x86_64-w64-mingw32-g++ \
                   x86_64-w64-mingw32-gcc-ar x86_64-w64-mingw32-gcc-nm \
                   x86_64-w64-mingw32-gcc-ranlib; do
            for cand in /usr/bin/${p}-posix /usr/bin/${p}-win32; do
              if [ -e "$cand" ]; then sudo update-alternatives --set "$p" "$cand" 2>/dev/null || true; fi
            done
          done
          x86_64-w64-mingw32-gcc --version | head -n1

      - name: 获取 VLC 源码
        run: |
          set -euo pipefail
          # 官方 tar.xz 由 make dist 生成，不含 extras/package/win32 打包脚本，
          # 因此优先 git clone 取完整工作树（含 build.sh / NSIS / MSI 打包脚本）。
          if git clone --depth 1 --branch "${VLC_VER}" \
               https://github.com/videolan/vlc.git "vlc-${VLC_VER}"; then
            echo "源码来源：git clone videolan/vlc tag ${VLC_VER}"
          else
            echo "::warning::git clone 失败，回退官方 tar.xz"
            curl -fSL --retry 5 --retry-delay 5 -o vlc-src.tar.xz \
              "https://download.videolan.org/pub/videolan/vlc/${VLC_VER}/vlc-${VLC_VER}.tar.xz"
            tar xf vlc-src.tar.xz
          fi
          test -d "vlc-${VLC_VER}"
          if [ ! -f "vlc-${VLC_VER}/extras/package/win32/build.sh" ]; then
            echo "::error::源码缺少 extras/package/win32/build.sh，无法交叉编译打包"
            ls -la "vlc-${VLC_VER}/extras/package" || true
            exit 1
          fi
          echo "源码目录：vlc-${VLC_VER}（已确认含 win32 打包脚本）"

      - name: 应用自制补丁
        run: |
          set -euo pipefail
          cd "vlc-${VLC_VER}"
          git init -q .
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -qm "upstream ${VLC_VER}"
          shopt -s nullglob
          for p in "${GITHUB_WORKSPACE}"/patches/*.patch; do
            echo "::group::应用 $(basename "$p")"
            git apply -p1 --3way --verbose "$p"
            echo "::endgroup::"
          done

      - name: 确定 contrib 地址
        env:
          INPUT_CONTRIB_URL: ${{ inputs.contrib_url }}
        run: |
          set -euo pipefail
          URL="${INPUT_CONTRIB_URL:-$DEFAULT_CONTRIB_URL}"
          echo "CONTRIB_URL=${URL}" >> "$GITHUB_ENV"
          echo "使用 contrib：${URL}"

      - name: 环境验证（probe 模式）
        if: env.MODE == 'probe'
        run: |
          set -euo pipefail
          cd "vlc-${VLC_VER}"
          make -C contrib prebuilt PREBUILT_URL="${CONTRIB_URL}"
          ls contrib/x86_64-w64-mingw32 | head -n 20
          ./bootstrap
          cd extras/package/win32
          ./configure.sh --host=x86_64-w64-mingw32 \
            --with-contrib="$PWD/../../../contrib/x86_64-w64-mingw32" \
            --enable-qt --disable-nls
          echo "== configure 通过 =="

      - name: 完整构建
        if: env.MODE != 'probe'
        run: |
          set -euo pipefail
          cd "vlc-${VLC_VER}"
          export MAKEFLAGS="-j$(nproc)"
          export VLC_PREBUILT_CONTRIBS_URL="${CONTRIB_URL}"
          chmod +x extras/package/win32/build.sh
          ./extras/package/win32/build.sh -a x86_64 -p -r -i r

      - name: 生成安装包（NSIS / MSI）
        if: env.MODE != 'probe'
        continue-on-error: true
        run: |
          set -uo pipefail
          cd "vlc-${VLC_VER}/win64"
          export PATH="/usr/x86_64-w64-mingw32/bin:${PATH}"
          echo "== release 7z =="
          make package-win32-release || echo "::warning title=release7z::package-win32-release 失败，仅保留 core 便携包"
          echo "== NSIS 安装包 =="
          make package-win32-exe || echo "::warning title=nsis::NSIS 安装包生成失败，本次不提供 setup.exe"
          echo "== MSI 安装包 =="
          make package-msi || echo "::warning title=msi::MSI 生成失败，跳过"
          ls -lh vlc-*.7z vlc-*.exe vlc-*.msi 2>/dev/null || true

      - name: 收集产物
        if: env.MODE != 'probe'
        run: |
          set -euo pipefail
          mkdir -p out
          find . -maxdepth 4 -type f \
            \( -name "vlc-*-win64*.7z" -o -name "vlc-*-win64*.zip" \
               -o -name "vlc-*-win64*.exe" -o -name "vlc-*.msi" \) \
            -size +10M -print -exec cp -n {} out/ \; || true
          cp "${GITHUB_WORKSPACE}"/patches/*.patch out/ 2>/dev/null || true
          ls -lh out/
          test "$(ls -A out)" || { echo "未收集到产物"; exit 1; }

      - name: 生成校验值
        if: env.MODE != 'probe'
        run: |
          set -euo pipefail
          cd out
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 发布到本仓库
        if: env.MODE != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VLC_VER}-enhanced"
          gh release create "$TAG" out/* \
            --repo "${{ github.repository }}" \
            --title "VLC ${VLC_VER} Enhanced (win64 便携包 + 安装包)" \
            --notes "基于 VLC ${VLC_VER} 官方源码自动构建的 Windows x64 增强版，提供**便携包**与**安装包**两种形态，按需任选其一。

          ## 两种形态怎么选
          | 产物 | 适用场景 | 特点 |
          | --- | --- | --- |
          | \`vlc-${VLC_VER}-win64.7z\` / \`.zip\` | 绿色免安装、放 U 盘、多版本共存 | 解压后运行 \`vlc.exe\`，不写注册表；**不自动关联视频文件**，需自行右键设为默认播放器 |
          | \`vlc-${VLC_VER}-win64.exe\`（NSIS 安装包） | 日常主力使用 | 安装时自动注册文件关联与右键菜单、创建桌面/开始菜单快捷方式、可在"应用和功能"中卸载；**装完双击视频即可直接调用**，无需额外设置默认播放器 |
          | \`vlc-${VLC_VER}-win64.msi\` | 企业批量部署 / 组策略分发 | 标准 Windows Installer 包，支持静默安装 |

          > 建议：普通使用选 \`.exe\` 安装包；不想动系统就下 \`.7z\` 便携包。

          ## 改动内容
          - 竖屏视频按可用屏幕等比缩放窗口，消除左右黑边，越界自动钳制回屏幕内
          - 视频窗口内单击播放/暂停，双击或拖动时自动取消

          ## 构建方式
          - 源码：https://download.videolan.org/pub/videolan/vlc/${VLC_VER}/vlc-${VLC_VER}.tar.xz
          - 工具链：MSYS2/MinGW-w64 交叉编译（x86_64-w64-mingw32）
          - 打包：7z/zip 便携包 + NSIS setup.exe + MSI
          - 补丁：见附件 $(basename $(ls patches/*.patch | head -n1))
          - 校验：见 SHA256SUMS.txt

          本项目遵循 GPLv2+，完整对应源码可由上游发布包叠加上述补丁还原。"

      - name: 补丁失效时提醒
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="构建失败：VLC ${VLC_VER} 自动构建未完成"
          BODY="自动构建在 $(date -u '+%Y-%m-%d %H:%M UTC') 失败，目标版本 ${VLC_VER}。
          请查看运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          常见原因：上游改动导致 patches/ 下的补丁无法应用，需要更新补丁。"
          if ! gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open | grep -q .; then
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" || true
          fi
